<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>

    html{
      font-family: figtree, sans-serif;
      font-size: 16px;
      font-weight: 500;
    }
    body
    {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: hsl(47, 88%, 63%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      background-color: white;
      padding: 24px;
      max-width: 384px;
      border-radius: 20px;
      box-shadow: 8px 8px 8px;
      border: 1px solid black;
    }

    img{
      width: 100%;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    .tag {
      background-color: hsl(47, 88%, 63%);
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.875rem;
      align-self: flex-start;
    }

    .date {
      font-size: 0.875rem;
      font-weight: 500;
    }

    .heading {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 5px 0;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .heading:hover {
      color: hsl(47, 88%, 63%);
    }

    .text {
      color: hsl(0, 0%, 50%);
      font-weight: 500;
      line-height: 1.5;
    }

    .author{
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
    }

    .author img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    .author span {
      font-weight: 800;
      font-size: 0.875rem;
    }

    @media (min-width: 768px) {
      .container {
        max-width: 500px;
        padding: 32px;
      }

      .heading {
        font-size: 2rem; 
      }
    }

    .attribution {
      font-size: 0.75rem;
      text-align: center;
      margin-top: 20px;
    }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

<div class="container">
  <img src="assets/images/illustration-article.svg" class="image">
  <span class="tag">Learning</span>

  <p class="date">Published 21 Dec 2023</p>

  <h1 class="heading">HTML & CSS foundations</h1>

  <p class="text">
    These languages are the backbone of every  website, defining structure, content, and presentation.
  </p>

  <div class="author">
    <img src="assets/images/image-avatar.webp" class="author_img" alt="">
    <span>Greg Hooper</span>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">NouvaZen</a>.
  </footer>
</div>

</body>
</html>
